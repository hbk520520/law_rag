name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  software-checks:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      LEGAL_DEVICE: cpu
      DEEPSEEK_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.9'
      - name: Check source and publication boundary
        run: python tools/check_repository.py
      - name: Install locked CPU test dependencies
        shell: pwsh
        run: |
          $env:PIP_CACHE_DIR = Join-Path $env:RUNNER_TEMP 'pip-cache'
          $env:HF_HOME = Join-Path $env:RUNNER_TEMP 'huggingface'
          python -m pip install --require-hashes --no-deps -r requirements-bootstrap.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --require-hashes --no-build-isolation --no-deps -r requirements-ci.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Software regression (no model or provider calls)
        run: python -m unittest discover -s tests -v
